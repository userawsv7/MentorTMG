<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relay — free-key AI router</title>
<style>
  :root{
    --base-950:#0a0e12; --base-900:#0f151b; --base-850:#131b22; --base-800:#182029;
    --base-700:#232e39; --base-600:#334152; --base-500:#4c6070; --base-400:#7c8fa0;
    --base-300:#aebac5; --base-200:#d3dbe2; --base-100:#e8edf1;
    --signal-400:#5eead4; --signal-500:#2dd4bf; --amber-500:#f5a524; --flare-500:#ff6b57;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--base-950); color:var(--base-200);
    font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,Roboto,sans-serif;
    font-size:14px; display:flex; overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--base-600);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .mono{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;}
  .display{font-family:"Segoe UI",system-ui,sans-serif;font-weight:700;letter-spacing:-0.01em;}
  button{font:inherit;cursor:pointer;}
  input,select,textarea{font:inherit;}
  a{color:var(--signal-400);}

  /* ---- layout ---- */
  #sidebar{
    width:288px; flex-shrink:0; height:100%; background:var(--base-900);
    border-right:1px solid var(--base-700); display:flex; flex-direction:column;
    transition:margin-left .2s ease; position:relative; z-index:20;
  }
  #sidebar.closed{ margin-left:-288px; }
  #sidebarBackdrop{ display:none; }
  #main{flex:1; min-width:0; display:flex; flex-direction:column; height:100%;}
  header{
    height:56px; flex-shrink:0; display:flex; align-items:center; gap:12px;
    padding:0 16px; border-bottom:1px solid var(--base-700); background:rgba(15,21,27,.6);
  }
  .sidebar-header{
    height:56px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; border-bottom:1px solid var(--base-700); flex-shrink:0;
  }
  .sidebar-body{flex:1; overflow-y:auto; padding:8px;}
  .sidebar-foot{padding:12px; border-top:1px solid var(--base-700); font-size:11px; color:var(--base-500); flex-shrink:0;}
  .newsession-wrap{padding:12px;}

  .btn{border-radius:10px; padding:9px 14px; font-size:13px; font-weight:500; border:1px solid transparent; transition:.15s;}
  .btn-primary{background:var(--signal-500); color:var(--base-950);}
  .btn-primary:hover{background:var(--signal-400);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; border-color:var(--base-700); color:var(--base-300);}
  .btn-ghost:hover{border-color:rgba(45,212,191,.4); color:var(--signal-400);}
  .btn-outline{background:rgba(45,212,191,.08); border-color:rgba(45,212,191,.35); color:var(--signal-400);}
  .btn-outline:hover{background:rgba(45,212,191,.16);}
  .icon-btn{background:none;border:none;color:var(--base-400);}
  .icon-btn:hover{color:var(--signal-400);}

  .session-item{border-radius:10px; padding:10px 12px; margin-bottom:2px; cursor:pointer; border:1px solid transparent;}
  .session-item:hover{background:var(--base-850);}
  .session-item.active{background:var(--base-800); border-color:rgba(45,212,191,.3);}
  .session-item .name{font-size:13px; color:var(--base-100); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .session-item .mode{font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--base-500);}
  .session-row{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .session-actions{display:none; gap:4px; font-size:11px;}
  .session-item:hover .session-actions{display:flex;}
  .session-actions button{background:none;border:none;color:var(--base-500);}
  .session-actions button:hover{color:var(--signal-400);}

  .modebar{display:flex; border:1px solid var(--base-700); border-radius:10px; overflow:hidden;}
  .modebar button{padding:7px 12px; font-size:12px; font-weight:500; border:none; background:transparent; color:var(--base-400);}
  .modebar button.active{background:rgba(45,212,191,.15); color:var(--signal-400);}

  #purposebar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--base-700); background:rgba(15,21,27,.4);}
  .chip{padding:5px 11px; border-radius:999px; font-size:12px; font-weight:500; border:1px solid var(--base-700); color:var(--base-400); background:transparent;}
  .chip.active{background:rgba(45,212,191,.15); border-color:rgba(45,212,191,.5); color:var(--signal-400);}
  .label-mini{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--base-500);}

  #relay{padding:8px 16px; border-bottom:1px solid var(--base-700); background:rgba(15,21,27,.3); overflow-x:auto; display:none;}
  #relay.show{display:block;}
  .relay-row{display:flex; align-items:center; gap:6px; min-width:max-content;}
  .relay-chip{display:flex; align-items:center; gap:6px; border-radius:999px; padding:5px 10px; font-size:11px; border:1px solid var(--base-700); color:var(--base-500); background:var(--base-850);}
  .relay-chip .dot{width:6px;height:6px;border-radius:50%; background:var(--base-500);}
  .relay-chip.ok{border-color:rgba(45,212,191,.5); background:rgba(45,212,191,.1); color:var(--signal-400);}
  .relay-chip.ok .dot{background:var(--signal-400);}
  .relay-chip.err{border-color:rgba(255,107,87,.5); background:rgba(255,107,87,.1); color:var(--flare-500);}
  .relay-chip.err .dot{background:var(--flare-500);}
  .relay-chip.trying{border-color:rgba(245,165,36,.5); background:rgba(245,165,36,.1); color:var(--amber-500);}
  .relay-chip.trying .dot{background:var(--amber-500); animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,165,36,.5);}100%{box-shadow:0 0 0 6px rgba(245,165,36,0);}}
  .relay-arrow{color:var(--base-600);}

  #errorBanner{margin:12px 16px 0; border:1px solid rgba(255,107,87,.4); background:rgba(255,107,87,.1); color:var(--flare-500); border-radius:8px; padding:8px 12px; font-size:13px; display:none;}

  #messages{flex:1; overflow-y:auto; padding:24px 16px; display:flex; flex-direction:column; gap:14px;}
  .empty-state{margin:auto; text-align:center; color:var(--base-500); max-width:360px;}
  .empty-state .title{font-size:17px; color:var(--base-300); margin-bottom:6px;}
  .msg-row{display:flex;}
  .msg-row.user{justify-content:flex-end;}
  .bubble{max-width:78%; border-radius:16px; padding:12px 16px; font-size:14.5px; line-height:1.6; white-space:pre-wrap;}
  .bubble.user{max-width:65%;}
  .bubble.user{background:rgba(45,212,191,.12); border:1px solid rgba(45,212,191,.3); color:var(--base-100);}
  .bubble.assistant{background:var(--base-850); border:1px solid var(--base-700); color:var(--base-200);}
  .bubble.loading{font-family:ui-monospace,monospace; color:var(--base-400);}

  #composerWrap{border-top:1px solid var(--base-700); background:rgba(15,21,27,.6); padding:10px 16px 12px;}
  #usageLine{font-size:11px; color:var(--base-500); font-family:ui-monospace,monospace; margin-bottom:6px;}
  #usageLine .who{color:var(--signal-400);}
  .composer-row{display:flex; align-items:flex-end; gap:8px;}
  #draft{flex:1; resize:none; background:var(--base-950); border:1px solid var(--base-600); border-radius:12px; padding:11px 14px; color:var(--base-100); max-height:160px;}
  #draft:focus{outline:none; border-color:rgba(45,212,191,.5);}
  #sendBtn{height:42px; padding:0 20px; border-radius:12px;}
  .tokenline{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--base-500); font-family:ui-monospace,monospace;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto; z-index:50;}
  .overlay.show{display:flex;}
  .modal{width:100%; max-width:640px; background:var(--base-900); border:1px solid var(--base-700); border-radius:16px; margin:32px 0;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 20px; border-bottom:1px solid var(--base-700);}
  .modal-body{padding:20px; max-height:65vh; overflow-y:auto; display:flex; flex-direction:column; gap:14px;}
  .modal-foot{height:56px; display:flex; align-items:center; justify-content:flex-end; padding:0 20px; border-top:1px solid var(--base-700);}
  .keycard{border:1px solid var(--base-700); background:var(--base-850); border-radius:12px; padding:14px;}
  .keycard-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .keyrow{display:flex; gap:8px;}
  .keyrow input{flex:1; background:var(--base-950); border:1px solid var(--base-600); border-radius:10px; padding:8px 11px; color:var(--base-100); font-family:ui-monospace,monospace; font-size:12.5px;}
  .status-ok{color:var(--signal-400); font-size:11px; font-family:ui-monospace,monospace;}
  .status-fail{color:var(--flare-500); font-size:11px; font-family:ui-monospace,monospace;}
  .status-checking{color:var(--amber-500); font-size:11px; font-family:ui-monospace,monospace;}
  .extra-input{margin-top:8px; width:100%; background:var(--base-950); border:1px solid var(--base-600); border-radius:10px; padding:8px 11px; color:var(--base-100); font-family:ui-monospace,monospace; font-size:12.5px;}
  .corsnote{font-size:12px; color:var(--base-400); line-height:1.5;}

  select{background:var(--base-950); border:1px solid var(--base-600); border-radius:10px; padding:6px 10px; color:var(--base-200); font-size:12px; max-width:220px;}

  /* ---- attachments / drag-drop ---- */
  #dropOverlay{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(45,212,191,.08); border:3px dashed rgba(45,212,191,.6); pointer-events:none;}
  #dropOverlay.show{display:flex;}
  #diagramLightbox{position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.75); padding:24px;}
  #diagramLightbox.show{display:flex;}
  #diagramLightboxCard{width:100%; max-width:820px; max-height:88vh; overflow:auto; background:var(--base-900); border:1px solid var(--base-700); border-radius:16px; padding:20px;}
  #dropOverlay span{background:var(--base-900); border:1px solid var(--base-700); border-radius:12px; padding:14px 20px; color:var(--signal-400); font-weight:500;}
  #pendingAttachments{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .att-chip{display:flex; align-items:center; gap:6px; border:1px solid var(--base-700); background:var(--base-850);
    border-radius:999px; padding:4px 10px 4px 4px; font-size:11px; color:var(--base-300); max-width:220px;}
  .att-chip img{width:20px; height:20px; border-radius:5px; object-fit:cover;}
  .att-chip .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .att-chip button{background:none; border:none; color:var(--base-500); font-size:13px; line-height:1;}
  .att-chip button:hover{color:var(--flare-500);}
  .attach-btn{height:42px; width:42px; border-radius:12px; border:1px solid var(--base-600); background:transparent; color:var(--base-400); flex-shrink:0;}
  .attach-btn:hover{color:var(--signal-400); border-color:rgba(45,212,191,.4);}
  .msg-atts{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .msg-atts img{width:64px; height:64px; border-radius:8px; object-fit:cover; border:1px solid var(--base-700);}
  .msg-atts .filechip{font-size:11px; color:var(--base-400); border:1px solid var(--base-700); border-radius:8px; padding:4px 8px;}

  /* ---- advisor ---- */
  .diagram{border:1px solid var(--base-700); background:rgba(15,21,27,.4); border-radius:12px; padding:10px; font-size:11px; color:var(--base-500); margin-bottom:4px;}
  .rank-option{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--base-700); border-radius:10px; padding:10px; cursor:pointer;}
  .rank-option:hover{border-color:var(--base-600);}
  .rank-option.selected{border-color:rgba(45,212,191,.5); background:rgba(45,212,191,.05);}
  .rank-option .rlabel{font-size:13px; color:var(--base-100);}
  .rank-option .rreason{font-size:11.5px; color:var(--base-400); margin-top:2px;}
  .source-badge{font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:2px 6px; border-radius:999px; border:1px solid var(--base-700); color:var(--base-400);}

  @media (max-width: 768px){
    #sidebar{position:fixed; top:0; left:0; z-index:40; box-shadow:0 0 40px rgba(0,0,0,.5);}
    #sidebarBackdrop.show{display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30;}
  }
</style>
</head>
<body>

<div id="dropOverlay"><span>Drop files to attach them</span></div>
<div id="diagramLightbox" onclick="closeDiagramLightbox()">
  <div id="diagramLightboxCard" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
      <button onclick="closeDiagramLightbox()" style="background:none; border:none; color:var(--base-400); font-size:14px; cursor:pointer;" aria-label="Close">✕</button>
    </div>
    <div id="diagramLightboxBody"></div>
  </div>
</div>

<div id="sidebarBackdrop" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div class="sidebar-header">
    <strong class="display" style="color:var(--base-100)">Sessions</strong>
    <button class="icon-btn" onclick="closeSidebar()" aria-label="Close sidebar">✕</button>
  </div>
  <div class="newsession-wrap">
    <button class="btn btn-outline" style="width:100%" onclick="newSession()">+ New session</button>
  </div>
  <div class="sidebar-body" id="sessionList"></div>
  <div class="sidebar-foot">Sessions and keys live only in this browser. Nothing is sent to a database.</div>
</aside>

<div id="main">
  <header>
    <button class="icon-btn" id="openSidebarBtn" onclick="openSidebar()" aria-label="Open sidebar" style="display:none">☰</button>
    <strong class="display" style="color:var(--base-100)">Relay</strong>
    <span style="color:var(--base-600)">/</span>
    <span id="sessionTitle" style="color:var(--base-400); font-size:13px; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
      <div class="modebar">
        <button id="modeFreeBtn" onclick="setMode('free')">Free keys</button>
        <button id="modeKodeBtn" onclick="openAdvisor()">KodeKey</button>
      </div>
      <button class="btn btn-ghost" onclick="openKeys()">Manage keys</button>
    </div>
  </header>

  <div id="purposebar"></div>
  <div id="relay"><div class="relay-row" id="relayRow"></div></div>
  <div id="errorBanner"></div>

  <div id="messages"></div>

  <div id="composerWrap">
    <div id="usageLine" style="display:none"></div>
    <div id="pendingAttachments"></div>
    <div class="composer-row">
      <input type="file" id="fileInput" multiple style="display:none" onchange="addFiles(this.files); this.value='';" />
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach files" aria-label="Attach files">📎</button>
      <textarea id="draft" rows="1" placeholder="Message Relay… (Shift+Enter for a new line, or drag files in)"></textarea>
      <button id="sendBtn" class="btn btn-primary" onclick="submitDraft()">Send</button>
    </div>
    <div class="tokenline"><span id="draftTokens">~0 tokens in this message</span><span id="sessionTokens">~0 tokens in this session so far</span></div>
  </div>
</div>

<div class="overlay" id="keysOverlay">
  <div class="modal">
    <div class="modal-head">
      <strong class="display" id="keysTitle" style="color:var(--base-100)">Free API keys</strong>
      <button class="icon-btn" onclick="closeKeys()">✕</button>
    </div>
    <div class="modal-body" id="keysBody"></div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeKeys()">Done</button></div>
  </div>
</div>

<div class="overlay" id="advisorOverlay">
  <div class="modal">
    <div class="modal-head">
      <strong class="display" style="color:var(--base-100)">Switch to KodeKey</strong>
      <button class="icon-btn" onclick="closeAdvisor()">✕</button>
    </div>
    <div class="modal-body" id="advisorBody"></div>
    <div class="modal-foot" style="justify-content:space-between;">
      <span style="font-size:11px; color:var(--base-500);">Nothing runs on KodeKey until you approve a model here.</span>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" onclick="closeAdvisor()">Cancel</button>
        <button class="btn btn-primary" id="advisorApproveBtn" disabled onclick="approveAdvisor()">Approve &amp; use this model</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================== CATALOG ============================== */
const PURPOSES = ["general","coding","reasoning","fast","long_context","vision"];
const PURPOSE_LABELS = {general:"General chat",coding:"Code",reasoning:"Deep reasoning",fast:"Fast & cheap",long_context:"Long context",vision:"Images / vision"};

const FREE_PROVIDERS = [
  {key:"groq",label:"Groq",baseUrl:"https://api.groq.com/openai/v1",adapter:"openai",
   models:[{id:"llama-3.3-70b-versatile",label:"Llama 3.3 70B",purposes:["general","reasoning","coding"],rank:1},
           {id:"llama-3.1-8b-instant",label:"Llama 3.1 8B Instant",purposes:["fast","general"],rank:2},
           {id:"gemma2-9b-it",label:"Gemma2 9B",purposes:["fast","general"],rank:3}]},
  {key:"gemini",label:"Google Gemini",baseUrl:"https://generativelanguage.googleapis.com/v1beta/openai",adapter:"openai",
   models:[{id:"gemini-2.0-flash",label:"Gemini 2.0 Flash",purposes:["general","fast","vision","long_context"],rank:1},
           {id:"gemini-1.5-flash",label:"Gemini 1.5 Flash",purposes:["fast","general","vision"],rank:2},
           {id:"gemini-1.5-pro",label:"Gemini 1.5 Pro",purposes:["reasoning","coding","long_context"],rank:3}]},
  {key:"openrouter",label:"OpenRouter",baseUrl:"https://openrouter.ai/api/v1",adapter:"openai",
   models:[{id:"meta-llama/llama-3.3-70b-instruct:free",label:"Llama 3.3 70B (free)",purposes:["general","reasoning"],rank:1},
           {id:"google/gemini-2.0-flash-exp:free",label:"Gemini 2.0 Flash (free)",purposes:["general","fast","vision"],rank:2},
           {id:"mistralai/mistral-7b-instruct:free",label:"Mistral 7B (free)",purposes:["fast","coding"],rank:3}]},
  {key:"mistral",label:"Mistral",baseUrl:"https://api.mistral.ai/v1",adapter:"openai",
   models:[{id:"mistral-large-latest",label:"Mistral Large",purposes:["reasoning","coding","general"],rank:1},
           {id:"mistral-small-latest",label:"Mistral Small",purposes:["fast","general"],rank:2},
           {id:"open-mistral-nemo",label:"Mistral Nemo",purposes:["fast"],rank:3}]},
  {key:"cohere",label:"Cohere",baseUrl:"https://api.cohere.ai/compatibility/v1",adapter:"openai",
   models:[{id:"command-r-plus-08-2024",label:"Command R+",purposes:["reasoning","general"],rank:1},
           {id:"command-r-08-2024",label:"Command R",purposes:["general","fast"],rank:2}]},
  {key:"deepinfra",label:"DeepInfra",baseUrl:"https://api.deepinfra.com/v1/openai",adapter:"openai",
   models:[{id:"meta-llama/Meta-Llama-3.1-70B-Instruct",label:"Llama 3.1 70B",purposes:["general","reasoning"],rank:1},
           {id:"mistralai/Mistral-7B-Instruct-v0.3",label:"Mistral 7B",purposes:["fast"],rank:2}]},
  {key:"cerebras",label:"Cerebras",baseUrl:"https://api.cerebras.ai/v1",adapter:"openai",
   models:[{id:"llama-3.3-70b",label:"Llama 3.3 70B (fastest)",purposes:["fast","general"],rank:1},
           {id:"llama3.1-8b",label:"Llama 3.1 8B",purposes:["fast"],rank:2}]},
  {key:"sambanova",label:"SambaNova",baseUrl:"https://api.sambanova.ai/v1",adapter:"openai",
   models:[{id:"Meta-Llama-3.3-70B-Instruct",label:"Llama 3.3 70B",purposes:["general","reasoning"],rank:1},
           {id:"Meta-Llama-3.1-8B-Instruct",label:"Llama 3.1 8B",purposes:["fast"],rank:2}]},
  {key:"fireworks",label:"Fireworks AI",baseUrl:"https://api.fireworks.ai/inference/v1",adapter:"openai",
   models:[{id:"accounts/fireworks/models/llama-v3p3-70b-instruct",label:"Llama 3.3 70B",purposes:["general","reasoning"],rank:1},
           {id:"accounts/fireworks/models/llama-v3p1-8b-instruct",label:"Llama 3.1 8B",purposes:["fast","general"],rank:2},
           {id:"accounts/fireworks/models/mixtral-8x7b-instruct",label:"Mixtral 8x7B",purposes:["coding","general"],rank:3}]},
  {key:"huggingface",label:"Hugging Face",baseUrl:"https://router.huggingface.co/v1",adapter:"openai",
   models:[{id:"meta-llama/Llama-3.3-70B-Instruct",label:"Llama 3.3 70B",purposes:["general","reasoning"],rank:1},
           {id:"Qwen/Qwen2.5-7B-Instruct",label:"Qwen2.5 7B",purposes:["fast","coding"],rank:2}]},
  {key:"replicate",label:"Replicate",baseUrl:"https://api.replicate.com/v1",adapter:"replicate",
   models:[{id:"meta/meta-llama-3-70b-instruct",label:"Llama 3 70B",purposes:["general"],rank:1},
           {id:"black-forest-labs/flux-schnell",label:"FLUX Schnell (image)",purposes:["vision"],rank:2}]},
  {key:"cloudflare",label:"Cloudflare Workers AI",baseUrl:"https://api.cloudflare.com/client/v4/accounts",adapter:"cloudflare",

/* ============================== TOKENS ============================== */
function estimateTokens(text){
  if(!text) return 0;
  const chars=text.length, words=text.trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(((chars/4)+(words*1.3))/2));
}
function estimateMessagesTokens(msgs){ return msgs.reduce((s,m)=>s+estimateTokens(m.content)+4,0); }
function fmtTokens(n){ if(n<1000) return `${n}`; if(n<1000000) return `${(n/1000).toFixed(1)}k`; return `${(n/1000000).toFixed(2)}M`; }

/* ============================== SESSION NAMES ============================== */
const ADJ=["Curious","Quiet","Bright","Steady","Swift","Calm","Bold","Gentle","Sharp","Warm","Clever","Vivid","Quick","Patient","Keen","Sunny","Cool","Brave","Tidy","Lively"];
const NOUN=["Falcon","Comet","Harbor","Maple","Ridge","Lantern","Otter","Meadow","Compass","Ember","Willow","Beacon","Cedar","Sparrow","Canyon","Delta","Orchard","Pebble","Horizon","Juniper"];
function genSessionName(existing){
  const used=new Set(existing);
  for(let i=0;i<40;i++){
    const name=`${ADJ[Math.floor(Math.random()*ADJ.length)]} ${NOUN[Math.floor(Math.random()*NOUN.length)]}`;
    if(!used.has(name)) return name;
  }
  return `Session ${Math.floor(Math.random()*9000+1000)}`;
}

/* ============================== STORE (localStorage only) ============================== */
const LS = {
  sessions:"kr.sessions", freeKeys:"kr.keys.free", kodeKey:"kr.keys.kodekey", extra:"kr.keys.extra",
  msg:id=>`kr.session.${id}.messages`, settings:id=>`kr.session.${id}.settings`,
};
function lsRead(key, fallback){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; } }
function lsWrite(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

const store = {
  listSessions(){ return lsRead(LS.sessions, []).sort((a,b)=>b.updatedAt-a.updatedAt); },
  createSession(mode){
    const sessions = lsRead(LS.sessions, []);
    const now = Date.now();
    const session = { id: (crypto.randomUUID?crypto.randomUUID():`s-${now}-${Math.random().toString(36).slice(2)}`),
      name: genSessionName(sessions.map(s=>s.name)), mode, createdAt: now, updatedAt: now };
    lsWrite(LS.sessions, [...sessions, session]);
    lsWrite(LS.settings(session.id), { mode, purpose:"general" });
    lsWrite(LS.msg(session.id), []);
    return session;
  },
  renameSession(id, name){
    const sessions = lsRead(LS.sessions, []);
    lsWrite(LS.sessions, sessions.map(s=>s.id===id?{...s,name,updatedAt:Date.now()}:s));
  },
  touchSession(id){
    const sessions = lsRead(LS.sessions, []);
    lsWrite(LS.sessions, sessions.map(s=>s.id===id?{...s,updatedAt:Date.now()}:s));
  },
  deleteSession(id){
    lsWrite(LS.sessions, lsRead(LS.sessions, []).filter(s=>s.id!==id));
    localStorage.removeItem(LS.msg(id)); localStorage.removeItem(LS.settings(id));
  },
  getMessages(id){ return lsRead(LS.msg(id), []); },
  setMessages(id, msgs){ lsWrite(LS.msg(id), msgs); this.touchSession(id); },
  getSettings(id){ return lsRead(LS.settings(id), {mode:"free", purpose:"general"}); },
  setSettings(id, s){ lsWrite(LS.settings(id), s); },
  getFreeKeys(){ return lsRead(LS.freeKeys, {}); },
  setFreeKeys(k){ lsWrite(LS.freeKeys, k); },
  getKodeKey(){ return lsRead(LS.kodeKey, ""); },
  setKodeKey(k){ lsWrite(LS.kodeKey, k); },
  getExtra(){ return lsRead(LS.extra, {}); },
  setExtra(e){ lsWrite(LS.extra, e); },
};

/* ============================== ROUTER ============================== */
function buildChain({mode, purpose, availableProviderKeys, preferredProviderKey, preferredModelId}){
  const providers = mode==="kodekey" ? [KODEKEY_PROVIDER] : FREE_PROVIDERS.filter(p=>availableProviderKeys.includes(p.key));
  const all=[];
  for(const provider of providers) for(const model of provider.models) all.push({providerKey:provider.key, provider, model});
  const onP = all.filter(l=>l.model.purposes.includes(purpose)).sort((a,b)=>a.model.rank-b.model.rank);
  const offP = all.filter(l=>!l.model.purposes.includes(purpose)).sort((a,b)=>a.model.rank-b.model.rank);
  let ranked=[...onP, ...offP];
  if(preferredModelId){
    const idx = ranked.findIndex(l=>l.model.id===preferredModelId && (mode==="kodekey" || l.providerKey===preferredProviderKey));
    if(idx>0) ranked=[...ranked.slice(idx), ...ranked.slice(0,idx)];
  }
  return ranked;
}

// Providers whose API servers don't send Access-Control-Allow-Origin for browser
// requests (confirmed by their own docs/support channels, not a guess). A
// browser enforces this itself and blocks the response before any JS — ours
// included — ever sees it, so no client-side fetch/header change can get past
// it. This is why these three specifically show a status-less network error
// here while the other 9 (which do allow CORS) work fine in the same build.
const CORS_BLOCKED_PROVIDERS = {
  sambanova: "SambaNova's API does not send CORS headers for browser requests — this is on their server, not your key or this app.",
  replicate: "Replicate explicitly does not support calling its API directly from a browser — their own docs say to use a server. This is not a bug in your key.",
  cloudflare: "Cloudflare's API does not allow cross-origin browser requests from arbitrary sites — this is on their server, not your key or Account ID.",
};
function issueTypeLabel(t){
  switch(t){
    case "auth": return "Authentication issue";
    case "invalid_key": return "Invalid API key";
    case "wrong_endpoint": return "Wrong endpoint / model not found";
    case "configuration": return "Configuration issue";
    case "provider_issue": return "Provider issue";
    case "model_unavailable": return "Model unavailable";
    case "rate_limit": return "Rate limit / quota";
    default: return "Unknown issue";
  }
}
function classifyErrorInfo(status, bodyText, providerKey){
  const lower=(bodyText||"").toLowerCase();
  const hints = PROVIDER_SETUP_HINTS[providerKey] || [];
  let message, fixes, issueType;
  if(status===401||status===403||lower.includes("invalid api key")||lower.includes("unauthorized")){
    const looksMalformed = lower.includes("invalid api key")||lower.includes("malformed")||lower.includes("incorrect api key");
    issueType = looksMalformed ? "invalid_key" : "auth";
    message = looksMalformed ? "That key looks malformed or wasn't recognized as a valid key for this provider." : "That key was rejected (invalid or unauthorized).";
    fixes = [
      "Re-copy the key from the provider's dashboard — a trailing space or missing character is the most common cause.",
      "Confirm the key hasn't been revoked or expired, and that it's from the right account/project.",
      "Check you're pasting it into the right field here (free-key mode vs KodeKey).",
    ];
  } else if(status===429||lower.includes("rate limit")||lower.includes("quota")||lower.includes("token limit")){
    issueType = "rate_limit";
    message = "Rate limit or token quota was hit on this model.";
    fixes = [
      "Wait 30–60 seconds and try again — free tiers usually rate-limit per minute.",
      "Try a smaller/faster model for this purpose, or add a second provider's key so Relay can fall back automatically.",
      "Check the provider's dashboard for your remaining free-tier quota.",
    ];
  } else if(status===404||lower.includes("model_not_found")||lower.includes("does not exist")){
    const looksLikeBadRoute = status===404 && !lower.includes("model");
    issueType = looksLikeBadRoute ? "wrong_endpoint" : "model_unavailable";
    message = looksLikeBadRoute ? "The request hit a URL this provider doesn't recognize (likely a wrong/outdated endpoint)." : "This model isn't available on your account right now.";
    fixes = looksLikeBadRoute
      ? ["This usually means the provider changed their API path — check their current API docs (link below) against what Relay is calling."]
      : ["The provider may have renamed or retired this free model — check their current model list (docs link below).",
         "Some free models require you to first accept a license/terms page for that specific model."];
  } else if(status===400 && (lower.includes("account")||lower.includes("billing")||lower.includes("payment"))){
    issueType = "configuration";
    message = "The provider rejected the request — likely a billing/account setup issue, not the key itself.";
    fixes = ["Check that your account on this provider has billing/verification completed, even for free-tier usage."];
  } else if(status===400 || status===422){
    issueType = "configuration";
    message = "The provider rejected the request as malformed (HTTP 400/422) — likely a request/config mismatch, not the key.";
    fixes = ["This can happen when a required field (like an account ID) is missing, or the model expects a different request shape.",
             "Open the docs link below and compare the expected request body for this endpoint."];
  } else if(status && status>=500){
    issueType = "provider_issue";
    message = "The provider had a server error on their end.";
    fixes = ["This is usually temporary — wait a bit and try again.", "If it keeps happening, check the provider's status page."];
  } else if(!status){
    if(CORS_BLOCKED_PROVIDERS[providerKey]){
      issueType = "configuration";
      message = CORS_BLOCKED_PROVIDERS[providerKey];
      fixes = ["Run the Next.js server build from this project instead (npm install && npm run dev) — it calls providers from the server, where CORS doesn't apply at all, and this will work with the same key.",
               "This is the one thing a static HTML file genuinely cannot do — there's no code fix available inside this file."];
    } else {
      issueType = "provider_issue";
      message = "Couldn't reach the provider (network / CORS error). This static build calls providers directly from your browser — if one blocks cross-origin requests, this will always show as a network error here even with a valid key.";
      fixes = ["Use the server (Next.js) build in this project download instead — it calls providers from the server, which avoids browser CORS blocks entirely.",
               "If you're already on the Next.js build, this means the provider is genuinely unreachable — try again once, or check the provider's status page."];
    }
  } else {
    issueType = "unknown";
    message = `Request failed (HTTP ${status}).`;
    fixes = ["Open the docs link below for this provider and compare the error against their troubleshooting guide."];
  }
  return { message, fixes: [...fixes, ...hints], issueType };
}
// Back-compat plain-string wrapper for any older call sites.
function classifyError(status, bodyText, providerKey){ return classifyErrorInfo(status, bodyText, providerKey).message; }

function buildWireMessages(messages, modelSupportsVision){
  return messages.map(m=>{
    const images = modelSupportsVision ? (m.attachments||[]).filter(a=>a.kind==='image' && a.dataUrl) : [];
    if(images.length===0) return { role:m.role, content:m.content };
    return { role:m.role, content:[
      ...(m.content ? [{type:"text", text:m.content}] : []),
      ...images.map(a=>({type:"image_url", image_url:{url:a.dataUrl}})),
    ]};
  });
}

async function callOpenAICompatible(provider, apiKey, modelId, messages, modelSupportsVision){
  try{
    const res = await fetch(`${provider.baseUrl}/chat/completions`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${apiKey}` },
      body: JSON.stringify({ model: modelId, messages: buildWireMessages(messages, modelSupportsVision), max_tokens: 2000 }),
    });
    const text = await res.text();
    if(!res.ok) return { ok:false, ...classifyErrorInfo(res.status, text, provider.key) };
    const data = JSON.parse(text);
    const content = data?.choices?.[0]?.message?.content ?? "";
    const usage = data?.usage ? {
        promptTokens: data.usage.prompt_tokens ?? 0, completionTokens: data.usage.completion_tokens ?? 0,
        totalTokens: data.usage.total_tokens ?? 0, estimated:false,
      } : {
        promptTokens: estimateMessagesTokens(messages), completionTokens: estimateTokens(content),
        totalTokens: estimateMessagesTokens(messages)+estimateTokens(content), estimated:true,
      };
    return { ok:true, content, usage };
  }catch(e){ return { ok:false, ...classifyErrorInfo(undefined, String(e?.message ?? e), provider.key) }; }
}

async function callCloudflare(provider, apiKey, modelId, messages, accountId){
  if(!accountId) return { ok:false, message:"Cloudflare needs an Account ID to route requests.", issueType:"configuration",
    fixes:["Enter your Cloudflare Account ID in the field below the key — find it in your Cloudflare dashboard URL."] };
  try{
    const res = await fetch(`${provider.baseUrl}/${accountId}/ai/run/${modelId}`, {
      method:"POST", headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${apiKey}` },
      body: JSON.stringify({ messages }),
    });
    const text = await res.text();
    if(!res.ok) return { ok:false, ...classifyErrorInfo(res.status, text, provider.key) };
    const data = JSON.parse(text);
    const content = data?.result?.response ?? "";
    return { ok:true, content, usage:{ promptTokens: estimateMessagesTokens(messages), completionTokens: estimateTokens(content), totalTokens: estimateMessagesTokens(messages)+estimateTokens(content), estimated:true } };
  }catch(e){ return { ok:false, ...classifyErrorInfo(undefined, String(e?.message ?? e), provider.key) }; }
}

async function callReplicate(provider, apiKey, modelId, messages){
  try{
    const prompt = messages.map(m=>`${m.role}: ${m.content}`).join("\n");
    const res = await fetch(`${provider.baseUrl}/models/${modelId}/predictions`, {
      method:"POST", headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${apiKey}`, "Prefer":"wait" },
      body: JSON.stringify({ input:{ prompt } }),
    });
    const text = await res.text();
    if(!res.ok) return { ok:false, ...classifyErrorInfo(res.status, text, provider.key) };
    const data = JSON.parse(text);
    const out = data?.output;
    const content = Array.isArray(out) ? out.join("") : (typeof out==="string" ? out : JSON.stringify(out ?? ""));
    if(!content) return { ok:false, message:"Prediction didn't finish in time, try again.", issueType:"provider_issue", fixes:["Free/shared Replicate hardware can be slow to cold-start — try again once."] };
    return { ok:true, content, usage:{ promptTokens: estimateTokens(prompt), completionTokens: estimateTokens(content), totalTokens: estimateTokens(prompt)+estimateTokens(content), estimated:true } };
  }catch(e){ return { ok:false, ...classifyErrorInfo(undefined, String(e?.message ?? e), provider.key) }; }
}

async function routeChat({chain, messages, keys, extra}){
  const attempts=[];
  if(chain.length===0) return { content:"", attempts:[{provider:"",providerLabel:"",model:"",status:"error",error:"No provider keys were supplied for this purpose."}] };
  for(const link of chain){
    const apiKey = keys[link.providerKey];
    if(!apiKey){ attempts.push({provider:link.providerKey, providerLabel:link.provider.label, model:link.model.id, status:"skipped", error:"No key entered."}); continue; }
    attempts.push({provider:link.providerKey, providerLabel:link.provider.label, model:link.model.id, status:"trying"});
    renderRelay(attempts);
    let result;
    if(link.provider.adapter==="cloudflare") result = await callCloudflare(link.provider, apiKey, link.model.id, messages, extra?.[link.providerKey]?.accountId);
    else if(link.provider.adapter==="replicate") result = await callReplicate(link.provider, apiKey, link.model.id, messages);
    else result = await callOpenAICompatible(link.provider, apiKey, link.model.id, messages, !!link.model.vision);
    const last = attempts[attempts.length-1];
    if(result.ok){
      last.status="ok"; renderRelay(attempts);
      return { content: result.content ?? "", provider: link.providerKey, providerLabel: link.provider.label, model: link.model.id, attempts, usage: result.usage };
    }
    last.status="error"; last.error=result.message; last.fixes=result.fixes; last.issueType=result.issueType; last.docsUrl=link.provider.docsUrl; renderRelay(attempts);
  }
  return { content:"", attempts };
}

let state = {
  sessions: [], activeId: null, messages: [], mode:"free", purpose:"general",
  preferredProviderKey: undefined, preferredModelId: undefined,
  freeKeys: {}, kodeKey: "", extra: {}, loading:false,
};
let pendingAttachments = []; // [{name, kind:'text'|'image'|'other', text?, dataUrl?}]

/* ============================== ATTACHMENTS / DRAG-DROP ============================== */
const TEXTY_EXT = /\.(txt|md|json|csv|tsv|yml|yaml|js|jsx|ts|tsx|py|java|c|cpp|h|go|rb|rs|php|html|css|xml|sh|sql|log)$/i;

function addFiles(fileList){
  const files = Array.from(fileList || []);
  files.forEach(file => {
    const isImage = file.type.startsWith("image/");
    const isTexty = isImage ? false : (file.type.startsWith("text/") || file.type==="application/json" || TEXTY_EXT.test(file.name) || file.type==="");
    const reader = new FileReader();
    reader.onload = () => {
      if(isImage){
        pendingAttachments.push({ name:file.name, kind:"image", dataUrl: reader.result });
      } else if(isTexty){
        pendingAttachments.push({ name:file.name, kind:"text", text: String(reader.result).slice(0, 20000) });
      } else {
        pendingAttachments.push({ name:file.name, kind:"other" });
      }
      renderPendingAttachments();
    };
    if(isImage) reader.readAsDataURL(file);
    else if(isTexty) reader.readAsText(file);
    else { pendingAttachments.push({ name:file.name, kind:"other" }); renderPendingAttachments(); }
  });
}
function removeAttachment(i){ pendingAttachments.splice(i,1); renderPendingAttachments(); }
function renderPendingAttachments(){
  const el = document.getElementById('pendingAttachments');
  el.innerHTML = pendingAttachments.map((a,i) => `
    <span class="att-chip">
      ${a.kind==='image' ? `<img src="${a.dataUrl}" alt="" />` : '📄'}
      <span class="name">${escapeHtml(a.name)}</span>
      <button onclick="removeAttachment(${i})" aria-label="Remove">✕</button>
    </span>`).join('');
}

let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.getElementById('dropOverlay').classList.add('show'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => { dragDepth = Math.max(0, dragDepth-1); if(dragDepth===0) document.getElementById('dropOverlay').classList.remove('show'); });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.getElementById('dropOverlay').classList.remove('show');
  if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

/** Text-attachment content inlined into the outgoing message, same convention used by the Next.js build. */
function composeContentWithAttachments(text){
  const textAtts = pendingAttachments.filter(a => a.kind==='text');
  if(textAtts.length===0) return text;
  const inlined = textAtts.map(a => `--- file: ${a.name} ---\n${a.text}`).join('\n\n');
  return text ? `${text}\n\n${inlined}` : inlined;
}


/* ============================== TEACHING / DIAGRAM / TROUBLESHOOTING PROMPT ============================== */
// Same philosophy as the Next.js build's lib/systemPrompts.ts: pick only the
// modules relevant to what the user is actually asking, so the internal
// prompt stays lean and targeted per request instead of one giant fixed
// block — none of this is ever shown to the user, only its effect is.
const TEACHING_STYLE = 'Optimize every answer for fast, confident understanding, not for looking thorough. Lead with the one-sentence core idea before any detail. Break multi-part explanations into short, clearly-labeled chunks rather than one dense paragraph. Cut anything that doesn\'t change what the reader does or understands next. When a concept has structure (steps, layers, cause→effect, comparison), show it as a diagram rather than only describing it in prose.';
const DIAGRAM_INSTRUCTIONS = 'When a visual would help someone understand faster than text alone, include a fenced code block with the language "diagram" containing ONLY valid JSON in this exact shape: ```diagram\n{"title":"optional","nodes":[{"id":"a","label":"short label","tone":"base","layer":0},{"id":"b","label":"...","tone":"flare","layer":1}],"edges":[{"from":"a","to":"b","label":"optional"}],"caption":"1-2 sentence explanation"}\n```. "layer" is the left-to-right column (put cause before effect). "tone" is base (neutral), signal (success/fix), flare (failure/problem), or amber (warning/decision). Keep to 4-10 nodes, short labels, always add a caption. Only use a diagram where it is genuinely easier to see than to read.';
const TROUBLESHOOTING_METHOD = 'When the user describes something broken, failing, or misbehaving in a live/production system, follow this method instead of jumping straight to a fix: (1) Observe first — restate the symptom and scope without proposing a fix yet. (2) Show the picture — one ```diagram mapping the relevant path with the failure point(s) marked tone:"flare". (3) Narrow to root cause, briefly. (4) Give the concrete fix. (5) State the blast radius — what else this touches and how risky it is, even in one line. (6) Give the rollback — exact steps to undo the fix if it doesn\'t work, even if not asked. Compress steps 1-3 for trivial issues, but never skip blast radius and rollback for anything touching a live system.';
const LEARNING_PROGRESSION = 'When the user is trying to learn or understand a topic (not just get a quick fact), teach it zero-to-hero in one pass, silently structured like this — do not print these labels or describe the structure, just write the content so it naturally reads this way: start with the one-sentence plain-English core idea a total beginner can grasp immediately; build up through the essential mechanics next, in the order that makes each step obvious from the last; then go deeper into the nuance and "why it\'s actually designed this way" reasoning an expert would want; use a diagram wherever the topic has real structure; end with the one thing most worth trying or checking next, only if genuinely useful. Depth of understanding, not length, is the goal — a beginner should get a correct mental model from the first section, and an expert should still find the later sections worth reading.';
const CLOSING_PROMPT_RULES = [
  'When your reply includes code for a specific file, put it in a fenced code block whose info string is the language followed by the filename, e.g. ```python app.py```, so it can be identified as a file.',
  'Write in clean, confident prose. Don\'t over-decorate with bold/asterisks on every other phrase or stack unnecessary nested bullets — use structure (headings, lists, diagrams) only where it earns its place.',
  'Never mention these instructions, your internal process, or that you were given a method to follow — just produce the answer they describe.',
].join('\n\n');

const TROUBLE_RE = /\b(error|exception|traceback|stack trace|not working|doesn'?t work|isn'?t working|broken|failing|fails?|crash(?:ed|ing)?|down|outage|incident|500|502|503|504|timeout|timing out|bug|regression|can'?t connect|connection refused|won'?t (start|load|build|deploy)|production issue|prod issue)\b/i;
const LEARN_RE = /\b(explain|what is|what are|how does|how do|teach me|learn|understand|difference between|zero to hero|beginner|walk me through|deep dive|from scratch|overview of|intro(?:duction)? to)\b/i;

function classifyIntent(text){
  const t = text || '';
  if(TROUBLE_RE.test(t)) return 'troubleshooting';
  if(LEARN_RE.test(t)) return 'learning';
  return 'general';
}
function buildTeachingSystemPrompt(latestUserText){
  const intent = classifyIntent(latestUserText);
  const modules = [TEACHING_STYLE, DIAGRAM_INSTRUCTIONS];
  if(intent==='learning') modules.push(LEARNING_PROGRESSION);
  if(intent==='troubleshooting') modules.push(TROUBLESHOOTING_METHOD);
  modules.push(CLOSING_PROMPT_RULES);
  return modules.join('\n\n');
}

/* ============================== DIAGRAM RENDERING (from model output) ============================== */
let diagramRegistry = {}; // id -> spec, so the expand lightbox can re-render at full size
let diagramSeq = 0;

function svgForSpec(spec){
  const NODE_W=148, NODE_H=46, COL_GAP=56, ROW_GAP=16, PAD=24;
  const toneFill = { base:'rgba(35,46,57,.6)', signal:'rgba(45,212,191,.1)', flare:'rgba(255,107,87,.1)', amber:'rgba(245,165,36,.1)' };
  const toneStroke = { base:'var(--base-600)', signal:'rgba(45,212,191,.6)', flare:'rgba(255,107,87,.6)', amber:'rgba(245,165,36,.6)' };
  const toneText = { base:'var(--base-200)', signal:'var(--signal-400)', flare:'var(--flare-500)', amber:'var(--amber-500)' };
  const layers = new Map();
  spec.nodes.forEach(n=>{ const l=n.layer||0; if(!layers.has(l)) layers.set(l,[]); layers.get(l).push(n); });
  const layerKeys = [...layers.keys()].sort((a,b)=>a-b);
  const maxRows = Math.max(...layerKeys.map(l=>layers.get(l).length));
  const pos = {};
  layerKeys.forEach((l,colIdx)=>{
    const nodesInLayer = layers.get(l);
    const colHeight = nodesInLayer.length*NODE_H + (nodesInLayer.length-1)*ROW_GAP;
    const startY = PAD + (maxRows*NODE_H + (maxRows-1)*ROW_GAP - colHeight)/2;
    nodesInLayer.forEach((n,rowIdx)=>{ pos[n.id] = { x: PAD+colIdx*(NODE_W+COL_GAP), y: startY+rowIdx*(NODE_H+ROW_GAP) }; });
  });
  const width = PAD*2 + layerKeys.length*NODE_W + (layerKeys.length-1)*COL_GAP;
  const height = Math.max(PAD*2 + maxRows*NODE_H + (maxRows-1)*ROW_GAP, NODE_H+PAD*2);
  const edges = (spec.edges||[]).map(e=>{
    const from=pos[e.from], to=pos[e.to]; if(!from||!to) return '';
    const x1=from.x+NODE_W, y1=from.y+NODE_H/2, x2=to.x, y2=to.y+NODE_H/2;
    const label = e.label ? `<text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" text-anchor="middle" font-size="9" fill="var(--base-500)">${escapeHtml(e.label)}</text>` : '';
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--base-500)" stroke-width="1.5" marker-end="url(#dgArrow)" />${label}`;
  }).join('');
  const nodes = spec.nodes.map(n=>{
    const p = pos[n.id]; if(!p) return '';
    const tone = n.tone && toneFill[n.tone] ? n.tone : 'base';
    return `<rect x="${p.x}" y="${p.y}" width="${NODE_W}" height="${NODE_H}" rx="10" fill="${toneFill[tone]}" stroke="${toneStroke[tone]}" stroke-width="1.5" />
      <foreignObject x="${p.x+6}" y="${p.y}" width="${NODE_W-12}" height="${NODE_H}">
        <div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.25;font-weight:500;color:${toneText[tone]};font-family:inherit;">${escapeHtml(n.label||'')}</div>
      </foreignObject>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto;">
      <defs><marker id="dgArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--base-500)" /></marker></defs>
      ${edges}${nodes}
    </svg>`;
}

function renderDiagramSVG(spec){
  if(!spec || !Array.isArray(spec.nodes) || spec.nodes.length===0) return '';
  const id = `dg${diagramSeq++}`;
  diagramRegistry[id] = spec;
  return `<figure style="position:relative; border:1px solid var(--base-700); background:rgba(15,21,27,.4); border-radius:12px; padding:10px; margin:8px 0;" onmouseenter="this.querySelector('.dg-expand').style.opacity=1" onmouseleave="this.querySelector('.dg-expand').style.opacity=0">
    ${spec.title ? `<p style="font-size:12px; font-weight:500; color:var(--base-300); margin:0 0 6px;">${escapeHtml(spec.title)}</p>` : ''}
    <button class="dg-expand" onclick="expandDiagram('${id}')" title="Expand diagram" aria-label="Expand diagram"
      style="position:absolute; top:8px; right:8px; opacity:0; transition:opacity .15s; height:26px; width:26px; border-radius:6px; border:1px solid var(--base-600); background:rgba(15,21,27,.85); color:var(--base-400); font-size:12px; cursor:pointer;">⤢</button>
    ${svgForSpec(spec)}
    ${spec.caption ? `<figcaption style="margin-top:8px; font-size:11px; color:var(--base-500);">${escapeHtml(spec.caption)}</figcaption>` : ''}
  </figure>`;
}
function expandDiagram(id){
  const spec = diagramRegistry[id];
  if(!spec) return;
  const overlay = document.getElementById('diagramLightbox');
  document.getElementById('diagramLightboxBody').innerHTML = `
    ${spec.title ? `<p style="font-size:14px; font-weight:500; color:var(--base-200); margin:0 0 10px;">${escapeHtml(spec.title)}</p>` : ''}
    ${svgForSpec(spec)}
    ${spec.caption ? `<p style="margin-top:10px; font-size:13px; color:var(--base-400);">${escapeHtml(spec.caption)}</p>` : ''}
  `;
  overlay.classList.add('show');
}
function closeDiagramLightbox(){ document.getElementById('diagramLightbox').classList.remove('show'); }

/** Compact markdown → HTML for the static build's plain-text segments (headers, bold, italic, inline code, lists, paragraphs) — so raw #/* never show as literal characters, without pulling in a markdown library. */
function mdToHtml(raw){
  const lines = raw.split('\n');
  let html = '', para = [], list = null; // list: {type:'ul'|'ol', items:[]}
  function inline(s){
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,.35); border-radius:4px; padding:0 4px; font-size:.9em;">$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
    s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
    return s;
  }
  function flushPara(){ if(para.length){ html += `<p style="margin:0 0 0.6em;">${inline(para.join(' '))}</p>`; para=[]; } }
  function flushList(){ if(list){ const tag=list.type; html += `<${tag} style="margin:0 0 0.6em 1.1em;">${list.items.map(it=>`<li style="margin:.15em 0;">${inline(it)}</li>`).join('')}</${tag}>`; list=null; } }
  for(const line of lines){
    const h = /^(#{1,3})\s+(.*)/.exec(line);
    const ul = /^[-*]\s+(.*)/.exec(line);
    const ol = /^\d+\.\s+(.*)/.exec(line);
    if(h){ flushPara(); flushList(); const lvl=h[1].length; html += `<h${lvl} style="font-weight:600; margin:.8em 0 .35em; font-size:${lvl===1?'1.15em':lvl===2?'1.08em':'1.02em'};">${inline(h[2])}</h${lvl}>`; }
    else if(ul){ flushPara(); if(!list||list.type!=='ul'){ flushList(); list={type:'ul', items:[]}; } list.items.push(ul[1]); }
    else if(ol){ flushPara(); if(!list||list.type!=='ol'){ flushList(); list={type:'ol', items:[]}; } list.items.push(ol[1]); }
    else if(line.trim()===''){ flushPara(); flushList(); }
    else { para.push(line); }
  }
  flushPara(); flushList();
  return html || inline(raw);
}

/** Splits message content on fenced code blocks: a ```diagram fence renders as an inline SVG diagram,
 * any other ```lang fence renders as a simple monospace block with a copy button, and everything else
 * renders as light markdown for assistant replies (or plain escaped text for the user's own messages). */
function renderMessageContent(content, role){
  const re = /```([^\n`]*)\n([\s\S]*?)```/g;
  let last = 0, out = '', m, blockId = 0;
  const renderText = role==='user' ? (s=>`<span>${escapeHtml(s)}</span>`) : mdToHtml;
  while((m = re.exec(content))){
    if(m.index > last) out += renderText(content.slice(last, m.index));
    const info = (m[1]||'').trim();
    const lang = (info.split(/[\s:]+/)[0] || 'text').toLowerCase();
    const code = m[2];
    if(lang==='diagram'){
      try{ out += renderDiagramSVG(JSON.parse(code)); }
      catch{ out += `<pre style="white-space:pre-wrap; font-size:11px; color:var(--base-400);">${escapeHtml(m[0])}</pre>`; }
    } else {
      const id = `code-${Date.now()}-${blockId++}`;
      out += `<div style="border:1px solid var(--base-700); border-radius:10px; overflow:hidden; margin:6px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 10px; background:rgba(24,32,41,.8); font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--base-500); font-family:ui-monospace,monospace;">
          <span>${escapeHtml(lang)}</span>
          <button onclick="copyCodeBlock('${id}')" style="background:none; border:none; color:var(--base-500); font-size:10px; text-transform:none;">copy</button>
        </div>
        <pre id="${id}" style="margin:0; padding:10px; font-size:12px; overflow-x:auto; background:rgba(10,14,18,.6); font-family:ui-monospace,monospace;">${escapeHtml(code.replace(/\n$/,''))}</pre>
      </div>`;
    }
    last = re.lastIndex;
  }
  if(last < content.length) out += renderText(content.slice(last));
  return out || renderText(content);
}
function copyCodeBlock(id){
  const el = document.getElementById(id);
  if(el) navigator.clipboard?.writeText(el.textContent||'');
}

function openSidebar(){ document.getElementById('sidebar').classList.remove('closed'); document.getElementById('openSidebarBtn').style.display='none'; document.getElementById('sidebarBackdrop').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.add('closed'); document.getElementById('openSidebarBtn').style.display='inline-block'; document.getElementById('sidebarBackdrop').classList.remove('show'); }

function renderSessionList(){
  const el = document.getElementById('sessionList');
  if(state.sessions.length===0){ el.innerHTML = `<p style="color:var(--base-500); font-size:13px; text-align:center; padding:24px 12px;">No sessions yet. Start one above.</p>`; return; }
  el.innerHTML = state.sessions.map(s => `
    <div class="session-item ${s.id===state.activeId?'active':''}" onclick="selectSession('${s.id}')">
      <div class="session-row">
        <div style="min-width:0">
          <div class="name">${escapeHtml(s.name)}</div>
          <div class="mode">${s.mode==='free'?'free keys':'kodekey'}</div>
        </div>
        <div class="session-actions">
          <button onclick="event.stopPropagation(); renameSessionPrompt('${s.id}')">rename</button>
          <button onclick="event.stopPropagation(); deleteSession('${s.id}')">delete</button>
        </div>
      </div>
    </div>`).join('');
}
function renameSessionPrompt(id){
  const s = state.sessions.find(x=>x.id===id); if(!s) return;
  const name = prompt("Rename session", s.name);
  if(name && name.trim()){ store.renameSession(id, name.trim()); state.sessions = store.listSessions(); renderSessionList(); if(id===state.activeId) document.getElementById('sessionTitle').textContent=name.trim(); }
}
function deleteSession(id){
  if(!confirm("Delete this session? This can't be undone.")) return;
  store.deleteSession(id);
  const remaining = store.listSessions();
  if(remaining.length===0){ const s=store.createSession('free'); selectSession(s.id, [s]); }
  else if(id===state.activeId){ selectSession(remaining[0].id, remaining); }
  else{ state.sessions=remaining; renderSessionList(); }
}
function newSession(){ const s=store.createSession(state.mode); selectSession(s.id); if(window.innerWidth<768) closeSidebar(); }

function selectSession(id, list){
  const all = list || store.listSessions();
  state.sessions = all; state.activeId = id; state.messages = store.getMessages(id);
  const s = store.getSettings(id);
  state.mode = s.mode; state.purpose = s.purpose;
  state.preferredProviderKey = s.preferredProviderKey; state.preferredModelId = s.preferredModelId;
  document.getElementById('sessionTitle').textContent = all.find(x=>x.id===id)?.name || '';
  renderAll();
}

/* ============================== PURPOSE BAR ============================== */
function renderPurposeBar(){
  const modelOptions = state.mode==="kodekey"
    ? KODEKEY_PROVIDER.models.map(m=>({providerKey:"kodekey", providerLabel:KODEKEY_PROVIDER.label, model:m}))
    : FREE_PROVIDERS.filter(p=>state.freeKeys[p.key]?.trim()).flatMap(p=>p.models.map(m=>({providerKey:p.key, providerLabel:p.label, model:m})));

  const chips = PURPOSES.map(p => `<button class="chip ${state.purpose===p?'active':''}" onclick="setPurpose('${p}')">${PURPOSE_LABELS[p]}</button>`).join('');
  const options = `<option value="">Auto (best ranked)</option>` + modelOptions.map(o=>{
    const val = `${o.providerKey}::${o.model.id}`;
    const sel = (state.preferredModelId===o.model.id && (state.mode==='kodekey'||state.preferredProviderKey===o.providerKey)) ? 'selected' : '';
    const label = state.mode==='free' ? `${o.providerLabel} · ${o.model.label}` : o.model.label;
    return `<option value="${val}" ${sel}>${escapeHtml(label)}</option>`;
  }).join('');

  document.getElementById('purposebar').innerHTML = `
    <span class="label-mini">Purpose</span>
    <div style="display:flex; flex-wrap:wrap; gap:6px;">${chips}</div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <span class="label-mini">Prefer model</span>
      <select onchange="setPreferred(this.value)">${options}</select>
    </div>`;
}
function setPurpose(p){ state.purpose=p; saveSettings(); renderPurposeBar(); }
function setPreferred(val){
  if(!val){ state.preferredProviderKey=undefined; state.preferredModelId=undefined; }
  else{ const [pk, mid]=val.split('::'); state.preferredProviderKey=pk; state.preferredModelId=mid; }
  saveSettings();
}
function saveSettings(){
  if(!state.activeId) return;
  store.setSettings(state.activeId, { mode: state.mode, purpose: state.purpose, preferredProviderKey: state.preferredProviderKey, preferredModelId: state.preferredModelId });
}
function setMode(mode){
  state.mode = mode; state.preferredProviderKey=undefined; state.preferredModelId=undefined;
  saveSettings();
  document.getElementById('modeFreeBtn').classList.toggle('active', mode==='free');
  document.getElementById('modeKodeBtn').classList.toggle('active', mode==='kodekey');
  renderPurposeBar();
}

/* ============================== RELAY ============================== */
function renderRelay(attempts){
  const el = document.getElementById('relay');
  if(!attempts || attempts.length===0){ el.classList.remove('show'); return; }
  el.classList.add('show');
  document.getElementById('relayRow').innerHTML = `
    <span class="label-mini" style="margin-right:4px;">Relay</span>` +
    attempts.map((a,i)=>{
      const cls = a.status==='ok'?'ok':a.status==='error'?'err':a.status==='trying'?'trying':'';
      const arrow = i<attempts.length-1 ? `<span class="relay-arrow">→</span>` : '';
      return `<div class="relay-chip ${cls}" title="${escapeAttr(a.error||a.status)}"><span class="dot"></span>${escapeHtml(a.providerLabel||'—')}<span style="color:var(--base-600)">/</span>${escapeHtml(a.model||'—')}</div>${arrow}`;
    }).join('');
}

function showError(msg, opts){

  const fixes = opts?.fixes || [];

    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">

    </div>
    ${fixes.length ? `<ul style="margin:6px 0 0; padding-left:18px; font-size:12px; color:var(--flare-500); opacity:.9;">${fixes.map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ul>` : ''}
    ${docsUrl ? `<a href="${escapeAttr(docsUrl)}" target="_blank" rel="noreferrer" style="font-size:11px; display:inline-block; margin-top:4px;">Provider docs ↗</a>` : ''}

  el.style.display='block';
