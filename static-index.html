function showUsage(usage, answeredBy){
  const el = document.getElementById('usageLine');
  if(!usage){ el.style.display='none'; return; }
  el.style.display='block';
  el.innerHTML = `answered by <span class="who">${escapeHtml(answeredBy)}</span> · ${usage.estimated?'~':''}${fmtTokens(usage.totalTokens)} tokens (${fmtTokens(usage.promptTokens)} in / ${fmtTokens(usage.completionTokens)} out)`;
}

async function submitDraft(){
  const ta = document.getElementById('draft');
  const text = ta.value.trim();
  if((!text && pendingAttachments.length===0) || state.loading || !state.activeId) return;
  showError(null);
  const atts = pendingAttachments;
  pendingAttachments = []; renderPendingAttachments();
  const composedText = composeContentWithAttachments(text);
  state.messages = [...state.messages, {role:'user', content:composedText, attachments: atts}];
  store.setMessages(state.activeId, state.messages);
  state.sessions = store.listSessions();
  ta.value=''; updateTokenLine();
  state.loading = true; renderMessages(); document.getElementById('sendBtn').disabled=true;
  renderRelay([]);

  const availableProviderKeys = Object.entries(state.freeKeys).filter(([,v])=>v && v.trim()).map(([k])=>k);
  if(state.mode==='free' && availableProviderKeys.length===0){
    showError("Enter at least one free API key first.");
    state.loading=false; renderMessages(); document.getElementById('sendBtn').disabled=false; return;
  }
  if(state.mode==='kodekey' && !state.kodeKey){
    showError("Enter your KodeKey first.");
    state.loading=false; renderMessages(); document.getElementById('sendBtn').disabled=false; return;
  }

  const chain = buildChain({ mode: state.mode, purpose: state.purpose, availableProviderKeys, preferredProviderKey: state.preferredProviderKey, preferredModelId: state.preferredModelId });
  const keys = state.mode==='free' ? state.freeKeys : { kodekey: state.kodeKey };
  const outgoing = [{ role:'system', content: buildTeachingSystemPrompt(text) }, ...state.messages];
  const result = await routeChat({ chain, messages: outgoing, keys, extra: state.extra });

  state.loading=false; document.getElementById('sendBtn').disabled=false;
  if(!result.content){
    const lastAttempt = result.attempts?.[result.attempts.length-1];
    showError(lastAttempt?.error || "Every ranked model in the chain failed. Check your keys or try another purpose.",
      { fixes: lastAttempt?.fixes, issueType: lastAttempt?.issueType, docsUrl: lastAttempt?.docsUrl });
    renderMessages(); return;
  }
  state.messages = [...state.messages, {role:'assistant', content: result.content}];
  store.setMessages(state.activeId, state.messages);
  state.sessions = store.listSessions();
  showUsage(result.usage, state.mode==='free' ? `${result.providerLabel} · ${result.model}` : result.model);
  renderMessages(); updateTokenLine();
}
document.getElementById('draft').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submitDraft(); }
});
document.getElementById('draft').addEventListener('input', updateTokenLine);

/* ============================== KEYS MODAL ============================== */
let keyStatuses = {};
function openKeys(){
  document.getElementById('keysTitle').textContent = state.mode==='free' ? 'Free API keys' : 'KodeKey';
  renderKeysBody();
  document.getElementById('keysOverlay').classList.add('show');
}
function closeKeys(){ document.getElementById('keysOverlay').classList.remove('show'); renderPurposeBar(); }

function statusBadge(pk){
  const st = keyStatuses[pk];
  if(!st) return '';
  if(st.status==='checking') return `<span class="status-checking">checking…</span>`;
  if(st.status==='ok') return `<span class="status-ok">● working</span>`;
  if(st.status==='fail') return `<span style="display:flex; align-items:center; gap:6px;">
      <span class="status-fail" title="${escapeAttr(st.message||'')}">● not working</span>
      ${st.issueType ? `<span style="font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:2px 6px; border-radius:999px; border:1px solid rgba(255,107,87,.4); color:var(--flare-500); font-family:ui-monospace,monospace;">${escapeHtml(issueTypeLabel(st.issueType))}</span>` : ''}
    </span>`;
  return '';
}
/** Failure detail panel shown under a key row: reason, ordered fixes, docs link — same shape as the Next.js build. */
function failDetail(pk, docsUrl){
  const st = keyStatuses[pk];
  if(!st || st.status!=='fail') return '';
  const fixes = st.fixes && st.fixes.length ? st.fixes : ["Double-check the key was copied in full, and that it's still active on the provider's dashboard."];
  return `<div style="margin-top:8px; border:1px solid rgba(255,107,87,.3); background:rgba(255,107,87,.06); border-radius:8px; padding:8px 10px;">
    <p style="font-size:12px; color:var(--flare-500); margin:0;">${escapeHtml(st.message||'')}</p>
    <ul style="margin:6px 0 0; padding-left:16px; font-size:11.5px; color:var(--base-300);">${fixes.map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ul>
    ${docsUrl ? `<a href="${escapeAttr(docsUrl)}" target="_blank" rel="noreferrer" style="font-size:11px;">Provider docs ↗</a>` : ''}
  </div>`;
}

function renderKeysBody(){
  const body = document.getElementById('keysBody');
  let html = `<p class="corsnote">Keys are stored only in this browser's local storage and sent straight to the provider you're calling — never saved to a database. This standalone build calls providers directly from your browser (no server relay), so a provider that blocks cross-origin requests will show a network error here even with a valid key — the Next.js server build in the project download avoids that.</p>`;

  if(state.mode==='kodekey'){
    html += `<div class="keycard">
      <div class="keycard-top"><label style="font-size:13px; font-weight:500;">${KODEKEY_PROVIDER.label}</label>${statusBadge('kodekey')}</div>
      <div class="keyrow">
        <input type="password" id="key-kodekey" value="${escapeAttr(state.kodeKey)}" placeholder="Enter your KodeKey" oninput="state.kodeKey=this.value; store.setKodeKey(this.value); renderPurposeBar();">
        <button class="btn btn-outline" onclick="testKey('kodekey')">Test</button>
      </div>
      ${failDetail('kodekey', KODEKEY_PROVIDER.docsUrl)}
    </div>`;
  } else {
    for(const p of FREE_PROVIDERS){
      html += `<div class="keycard">
        <div class="keycard-top"><label style="font-size:13px; font-weight:500;">${p.label}</label>${statusBadge(p.key)}</div>
        <div class="keyrow">
          <input type="password" id="key-${p.key}" value="${escapeAttr(state.freeKeys[p.key]||'')}" placeholder="${p.key.toUpperCase()}_API_KEY" oninput="state.freeKeys['${p.key}']=this.value; store.setFreeKeys(state.freeKeys); renderPurposeBar();">
          <button class="btn btn-outline" onclick="testKey('${p.key}')">Test</button>
        </div>
        ${(p.needsExtra||[]).map(f=>`<input class="extra-input" id="extra-${p.key}-${f.field}" value="${escapeAttr(state.extra[p.key]?.[f.field]||'')}" placeholder="${f.placeholder}" oninput="state.extra['${p.key}']=state.extra['${p.key}']||{}; state.extra['${p.key}']['${f.field}']=this.value; store.setExtra(state.extra);">`).join('')}
        ${failDetail(p.key, p.docsUrl)}
      </div>`;
    }
  }
  body.innerHTML = html;
}

async function testKey(providerKey){
  const mode = providerKey==='kodekey' ? 'kodekey' : 'free';
  const apiKey = providerKey==='kodekey' ? state.kodeKey : (state.freeKeys[providerKey]||'');
  if(!apiKey.trim()){ return; }
  keyStatuses[providerKey] = { status:'checking' }; renderKeysBody();
  const provider = getProvider(mode, providerKey);
  try{
    if(provider.adapter==='cloudflare'){
      const accountId = state.extra[providerKey]?.accountId;
      if(!accountId){
        keyStatuses[providerKey] = { status:'fail', message:'Needs an Account ID too.', issueType:'configuration',
          fixes:['Enter your Cloudflare Account ID in the field below the key — find it in your Cloudflare dashboard URL.'] };
        renderKeysBody(); return;
      }
      // Token verification is a USER-scoped endpoint on Cloudflare's API
      // (/client/v4/user/tokens/verify), not account-scoped — using the
      // account-scoped path here was the actual bug behind "Cloudflare not
      // working" reports, independent of whether the key itself was valid.
      const verifyRes = await fetch(`https://api.cloudflare.com/client/v4/user/tokens/verify`, { headers:{ Authorization:`Bearer ${apiKey}` } });
      const verifyText = await verifyRes.text();
      if(!verifyRes.ok){
        keyStatuses[providerKey] = { status:'fail', ...classifyErrorInfo(verifyRes.status, verifyText, provider.key) };
        renderKeysBody(); return;
      }
      const modelsRes = await fetch(`${provider.baseUrl}/${accountId}/ai/models/search`, { headers:{ Authorization:`Bearer ${apiKey}` } });
      if(!modelsRes.ok){
        keyStatuses[providerKey] = { status:'fail', message:"Your API token is valid, but this Account ID didn't work with it.", issueType:'configuration',
          fixes:["Double-check the Account ID — it's the 32-character hex ID from your Cloudflare dashboard URL, not the token itself.",
                 'Confirm the token has "Workers AI: Read" permission scoped to this account.'] };
        renderKeysBody(); return;
      }
      keyStatuses[providerKey] = { status:'ok' };
    } else if(provider.adapter==='replicate'){
      const res = await fetch(`${provider.baseUrl}/account`, { headers:{ Authorization:`Bearer ${apiKey}` } });
      const text = await res.text();
      keyStatuses[providerKey] = res.ok ? {status:'ok'} : { status:'fail', ...classifyErrorInfo(res.status, text, provider.key) };
    } else {
      const res = await fetch(`${provider.baseUrl}/models`, { headers:{ Authorization:`Bearer ${apiKey}` } });
      if(res.ok){ keyStatuses[providerKey]={status:'ok'}; renderKeysBody(); return; }
      // /models either isn't exposed or failed for a reason unrelated to the key —
      // fall back to a real chat call. Try every candidate chat model in order
      // (not just the first) so one stale/renamed model id doesn't produce a
      // false "not working" when the key itself is actually fine; stop early on
      // an auth/rate-limit failure since retrying other models won't change that.
      const candidates = provider.models.filter(m=>!m.imageGen).map(m=>m.id);
      let lastFail = null;
      for(const modelId of candidates){
        const res2 = await fetch(`${provider.baseUrl}/chat/completions`, {
          method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${apiKey}`},
          body: JSON.stringify({ model: modelId, messages:[{role:'user', content:'hi'}], max_tokens:1 }),
        });
        if(res2.ok){ keyStatuses[providerKey]={status:'ok'}; renderKeysBody(); return; }
        const text2 = await res2.text();
        lastFail = classifyErrorInfo(res2.status, text2, provider.key);
        if(lastFail.issueType==='auth' || lastFail.issueType==='invalid_key' || lastFail.issueType==='rate_limit') break;
      }
      keyStatuses[providerKey] = { status:'fail', ...(lastFail || { message:'No response from the provider.', issueType:'provider_issue', fixes:[] }) };
    }
  }catch(e){
    keyStatuses[providerKey] = { status:'fail', ...classifyErrorInfo(undefined, String(e?.message ?? e), provider.key) };
  }
  renderKeysBody();
}


/* ============================== KODEKEY ADVISOR ============================== */
// Clicking "KodeKey" never switches mode directly. It opens this advisor,
// which uses a FREE key (never KodeKey) to rank all 39 KodeKey models for
// the task and suggest a tightened prompt. Only the explicit "Approve & use
// this model" click ever sets mode:"kodekey" or sends anything to KodeKey.
let advisor = { ranking:null, improvedPrompt:null, source:null, advisedBy:null, note:null, selected:null, useImproved:true, prompt:"" };

function openAdvisor(){
  advisor = { ranking:null, improvedPrompt:null, source:null, advisedBy:null, note:null, selected:null, useImproved:true, prompt: document.getElementById('draft').value.trim() };
  renderAdvisorBody();
  document.getElementById('advisorApproveBtn').disabled = true;
  document.getElementById('advisorOverlay').classList.add('show');
}
function closeAdvisor(){ document.getElementById('advisorOverlay').classList.remove('show'); }

function heuristicKodeKeyRanking(purpose){
  const onP = KODEKEY_PROVIDER.models.filter(m=>m.purposes.includes(purpose)).sort((a,b)=>a.rank-b.rank);
  const rest = KODEKEY_PROVIDER.models.filter(m=>!m.purposes.includes(purpose)).sort((a,b)=>a.rank-b.rank);
  return [...onP, ...rest].slice(0,5).map((m,i)=>({ modelId:m.id, label:m.label,
    reason: i===0 ? `Top-ranked KodeKey model for "${purpose}" (static ranking — no free-tier advisor ran).`
                  : `Ranked #${i+1} for "${purpose}" among KodeKey models (static ranking).` }));
}
function buildAdvisorSystemPrompt(purpose){
  const catalogue = KODEKEY_PROVIDER.models.map(m=>`- id: "${m.id}", label: "${m.label}", good for: ${m.purposes.join(", ")}${m.vision?", vision":""}`).join("\n");
  return [
    "You are a pre-flight advisor. You do NOT execute the user's task. Your only job is to:",
    "1. Slightly improve/clarify the user's prompt if it's ambiguous (or return it unchanged if it's already clear).",
    "2. Rank which of the following models would best handle it, most suitable first, with a one-sentence reason each.",
    "", "The user's stated purpose for this task is: " + purpose, "",
    "Available models (choose only from this exact list of ids):", catalogue, "",
    'Respond with ONLY a single JSON object, no markdown fences, no prose outside the JSON, in exactly this shape:',
    '{"improvedPrompt": "...", "ranking": [{"modelId": "...", "reason": "..."}]}',
    "Include 3 to 5 models in the ranking, ordered best-first.",
  ].join("\n");
}
function parseAdvisorReply(raw){
  try{
    const cleaned = raw.trim().replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/```\s*$/i,"");
    const parsed = JSON.parse(cleaned);
    if(!parsed || typeof parsed.improvedPrompt!=="string" || !Array.isArray(parsed.ranking)) return null;
    const ranking = parsed.ranking.filter(r=>r && typeof r.modelId==="string").map(r=>({modelId:r.modelId, reason: typeof r.reason==="string"?r.reason:""}));
    if(ranking.length===0) return null;
    return { improvedPrompt: parsed.improvedPrompt, ranking };
  }catch{ return null; }
}

async function analyzeAdvisor(){
  advisor.prompt = document.getElementById('advisorPrompt').value;
  const availableProviderKeys = Object.entries(state.freeKeys).filter(([,v])=>v && v.trim()).map(([k])=>k);
  const modelLabel = id => KODEKEY_PROVIDER.models.find(m=>m.id===id)?.label ?? id;

  if(availableProviderKeys.length===0 || !advisor.prompt.trim()){
    advisor.ranking = heuristicKodeKeyRanking(state.purpose);
    advisor.improvedPrompt = advisor.prompt; advisor.source = "heuristic";
    advisor.note = availableProviderKeys.length===0 ? "No free API key is configured, so this is a static ranking, not a model-generated one." : undefined;
    advisor.selected = advisor.ranking[0]?.modelId ?? null;
    renderAdvisorBody(); return;
  }

  document.getElementById('advisorAnalyzeBtn').disabled = true;
  document.getElementById('advisorAnalyzeBtn').textContent = "Asking a free model to rank KodeKey models…";
  try{
    const chain = buildChain({ mode:"free", purpose:"reasoning", availableProviderKeys });
    const result = await routeChat({ chain, messages:[
      {role:"system", content: buildAdvisorSystemPrompt(state.purpose)},
      {role:"user", content: advisor.prompt},
    ], keys: state.freeKeys, extra: state.extra });

    const parsed = result.content ? parseAdvisorReply(result.content) : null;
    const validIds = new Set(KODEKEY_PROVIDER.models.map(m=>m.id));
    if(!parsed){
      advisor.ranking = heuristicKodeKeyRanking(state.purpose); advisor.improvedPrompt = advisor.prompt; advisor.source = "heuristic";
      advisor.note = "The free-tier advisor call didn't return a usable ranking, so this is a static fallback ranking instead.";
    } else {
      const ranking = parsed.ranking.filter(r=>validIds.has(r.modelId)).map(r=>({modelId:r.modelId, label:modelLabel(r.modelId), reason:r.reason||"Suggested by the free-tier advisor model."}));
      if(ranking.length===0){
        advisor.ranking = heuristicKodeKeyRanking(state.purpose); advisor.improvedPrompt = advisor.prompt; advisor.source = "heuristic";
        advisor.note = "The advisor model's ranking didn't match any real KodeKey model id, so this is a static fallback ranking instead.";
      } else {
        advisor.ranking = ranking; advisor.improvedPrompt = parsed.improvedPrompt || advisor.prompt; advisor.source = "free-model";
        advisor.advisedBy = `${result.providerLabel} · ${result.model}`; advisor.note = undefined;
      }
    }
  } catch(e) {
    advisor.ranking = heuristicKodeKeyRanking(state.purpose); advisor.improvedPrompt = advisor.prompt; advisor.source = "heuristic";
    advisor.note = "The free-tier advisor call failed, so this is a static fallback ranking instead.";
  }
  advisor.selected = advisor.ranking[0]?.modelId ?? null;
  document.getElementById('advisorAnalyzeBtn').disabled = false;
  renderAdvisorBody();
}

function selectAdvisorModel(id){ advisor.selected = id; renderAdvisorBody(); }
function toggleAdvisorImproved(checked){ advisor.useImproved = checked; }

function renderAdvisorBody(){
  const hasFreeKeys = Object.values(state.freeKeys).some(v=>v && v.trim());
  let html = `<div class="diagram">Free key → ranks &amp; improves prompt → you review &amp; pick → KodeKey runs. Nothing reaches KodeKey automatically.</div>`;
  html += `<label class="label-mini">What do you want to do?</label>
    <textarea id="advisorPrompt" rows="3" placeholder="Describe your task — the advisor will suggest which KodeKey model fits best."
      style="width:100%; resize:none; background:var(--base-950); border:1px solid var(--base-600); border-radius:10px; padding:9px 12px; color:var(--base-100); margin-top:4px;"
      oninput="advisor.prompt=this.value">${escapeHtml(advisor.prompt||'')}</textarea>`;
  if(!hasFreeKeys) html += `<p style="font-size:12px; color:var(--amber-500); margin:6px 0 0;">No free API key is configured, so ranking will use a static fallback instead of a live free-model analysis. Add a free key in "Manage keys" first for a smarter recommendation.</p>`;
  html += `<button class="btn btn-outline" id="advisorAnalyzeBtn" style="width:100%; margin-top:10px;" onclick="analyzeAdvisor()">Analyze &amp; rank KodeKey models</button>`;

  if(advisor.ranking && advisor.ranking.length>0){
    html += `<div style="margin-top:14px;">
      <span class="source-badge">${advisor.source==='free-model' ? `Ranked by ${escapeHtml(advisor.advisedBy||'a free model')}` : 'Static fallback ranking'}</span>
      ${advisor.note ? `<p style="font-size:12px; color:var(--base-500); margin:6px 0 0;">${escapeHtml(advisor.note)}</p>` : ''}`;
    if(advisor.improvedPrompt && advisor.improvedPrompt !== advisor.prompt){
      html += `<div class="keycard" style="margin-top:10px;">
        <label style="display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--base-300);">
          <input type="checkbox" ${advisor.useImproved?'checked':''} onchange="toggleAdvisorImproved(this.checked)" style="margin-top:2px;">
          <span>Use this improved prompt instead:<br><span style="color:var(--base-100); font-family:ui-monospace,monospace; font-size:11.5px; white-space:pre-wrap;">${escapeHtml(advisor.improvedPrompt)}</span></span>
        </label>
      </div>`;
    }
    html += `<div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">` +
      advisor.ranking.map((r,i)=>`
        <div class="rank-option ${advisor.selected===r.modelId?'selected':''}" onclick="selectAdvisorModel('${r.modelId.replace(/'/g,"\\'")}')">
          <input type="radio" name="advisor-model" ${advisor.selected===r.modelId?'checked':''} style="margin-top:2px;">
          <div style="min-width:0;">
            <div class="rlabel"><span style="color:var(--base-500); font-family:ui-monospace,monospace; font-size:11px; margin-right:6px;">#${i+1}</span>${escapeHtml(r.label)}</div>
            <div class="rreason">${escapeHtml(r.reason)}</div>
          </div>
        </div>`).join('') + `</div>`;
    html += `</div>`;
  }
  document.getElementById('advisorBody').innerHTML = html;
  document.getElementById('advisorApproveBtn').disabled = !advisor.selected;
}

function approveAdvisor(){
  if(!advisor.selected) return;
  const shouldUseImproved = advisor.useImproved && advisor.improvedPrompt && advisor.improvedPrompt !== advisor.prompt;
  const finalPrompt = (shouldUseImproved ? advisor.improvedPrompt : advisor.prompt || "").trim();
  closeAdvisor();
  state.mode = "kodekey"; state.preferredProviderKey = "kodekey"; state.preferredModelId = advisor.selected;
  saveSettings();
  document.getElementById('modeFreeBtn').classList.toggle('active', false);
  document.getElementById('modeKodeBtn').classList.toggle('active', true);
  renderPurposeBar();
  if(finalPrompt){ document.getElementById('draft').value = finalPrompt; updateTokenLine(); submitDraft(); }
}

/* ============================== UTIL ============================== */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function renderMsgAtts(attachments){
  const list = (attachments||[]).filter(a=>a.kind==='image'||a.kind==='other');
  if(list.length===0) return '';
  return `<div class="msg-atts">${list.map(a=>a.kind==='image'
    ? `<img src="${a.dataUrl}" alt="${escapeAttr(a.name)}" title="${escapeAttr(a.name)}" />`
    : `<span class="filechip">📄 ${escapeHtml(a.name)}</span>`).join('')}</div>`;
}

/* ============================== RENDER ALL / INIT ============================== */
function renderAll(){
  renderSessionList();
  document.getElementById('modeFreeBtn').classList.toggle('active', state.mode==='free');
  document.getElementById('modeKodeBtn').classList.toggle('active', state.mode==='kodekey');
  renderPurposeBar();
  renderRelay([]);
  showError(null);
  showUsage(null);
  renderMessages();
  updateTokenLine();
}

(function init(){
  state.freeKeys = store.getFreeKeys();
  state.kodeKey = store.getKodeKey();
  state.extra = store.getExtra();
  const existing = store.listSessions();
  if(existing.length>0){ selectSession(existing[0].id, existing); }
  else{ const s = store.createSession('free'); selectSession(s.id, [s]); }
  if(window.innerWidth<768) closeSidebar();
})();
</script>
